<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VisionPoint Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="VisionPoint Logo">
            <div class="logo-text">
                <h2>VisionPoint</h2>
                <p>Biometric Attendance System</p>
            </div>
        </div>

        <nav>
            <ul>
                <li>Students Registration</li>
                <li>Manage Students</li>
                <li>Mark Attendance</li>
                <li>Attendance Details</li>
                <li>Manage Cameras</li>
            </ul>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <div class="top-bar">
            <div class="time-section">
                <h1>10:00</h1>
                <p>Monday, february 11</p>
            </div>

            <div class="profile-box"></div>
        </div>

        <div class="cards">
            <div class="card dark-card">
                <div class="card-icon">🎓</div>
                <h3>Total Students</h3>
            </div>

            <div class="card blue-card">
                <h3>Check-ins</h3>
            </div>

            <div class="card blue-card">
                <h3>Check-out</h3>
            </div>

            <div class="card blue-card">
                <h3>Cameras</h3>
            </div>
        </div>

        <button class="attendance-btn">Mark Attendance</button>

    </main>

</div>

</body>
</html>
