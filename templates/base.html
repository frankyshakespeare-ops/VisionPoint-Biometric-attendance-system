<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionPoint - {% block title %}Accueil{% endblock %}</title>
    
    {% load static %}
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        /* Style pour la sidebar */
        .sidebar {
            width: 240px; /* Largeur fixe */
            transition: width 0.3s ease;
        }
        
        .sidebar-item {
            transition: all 0.2s ease;
            border-radius: 12px;
            margin: 4px 0;
        }
        
        .sidebar-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-item.active {
            background-color: rgba(255, 255, 255, 0.15);
            border-left: 4px solid #FFD700;
        }
        
        /* Style pour les cartes */
        .stat-card {
            border-radius: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
        }
        
        /* Contenu principal avec marge fixe */
        .main-content {
            margin-left: 260px; /* Même largeur que la sidebar */
            width: calc(100% - 260px);
            transition: margin-left 0.3s ease, width 0.3s ease;
        }
        
        /* Header */
        .header {
            height: 70px;
            background-color: white;
            border-bottom: 1px solid #e5e7eb;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar fixe avec largeur constante -->
        <div class="sidebar h-full bg-[#233853] text-white fixed left-0 top-0 overflow-y-auto shadow-xl">
            <!-- Logo et titre -->
            <div class="flex items-center px-1 py-1 border-b border-white/10">
                <img src="{% static 'logo.png' %}" alt="VisionPoint" class="h-50 w-auto mr-3">
                <span class="font-bold text-xl text-white"></span>
            </div>
            
            <!-- Menu Items -->
            <nav class="flex-1 py-6 px-4">
                <ul class="space-y-1">
                    <!-- Dashboard -->
                    <li>
                        <a href="{% url 'home' %}" class="sidebar-item flex items-center py-3 px-4 {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                            <i class="fas fa-home text-xl w-8"></i>
                            <span class="text-sm font-medium">Dashboard</span>
                        </a>
                    </li>
                    
                    <!-- Student Registration -->
                    <li>
                        <a href="{% url 'capture_student' %}" class="sidebar-item flex items-center py-3 px-4 {% if request.resolver_match.url_name == 'capture_student' %}active{% endif %}">
                            <i class="fas fa-user-plus text-xl w-8"></i>
                            <span class="text-sm font-medium">Student Registration</span>
                        </a>
                    </li>
                    
                    <!-- Manage Students -->
                    <li>
                        <a href="{% url 'student-list' %}" class="sidebar-item flex items-center py-3 px-4 {% if request.resolver_match.url_name == 'student-list' %}active{% endif %}">
                            <i class="fas fa-users text-xl w-8"></i>
                            <span class="text-sm font-medium">Manage Students</span>
                        </a>
                    </li>
                    
                    <!-- Mark Attendance -->
                    <li>
                        <a href="{% url 'capture_and_recognize' %}" class="sidebar-item flex items-center py-3 px-4 {% if request.resolver_match.url_name == 'capture_and_recognize' %}active{% endif %}">
                            <i class="fas fa-check-circle text-xl w-8"></i>
                            <span class="text-sm font-medium">Mark Attendance</span>
                        </a>
                    </li>
                    
                    <!-- Attendance Details -->
                    <li>
                        <a href="{% url 'student_attendance_list' %}" class="sidebar-item flex items-center py-3 px-4 {% if request.resolver_match.url_name == 'student_attendance_list' %}active{% endif %}">
                            <i class="fas fa-calendar-alt text-xl w-8"></i>
                            <span class="text-sm font-medium">Attendance Details</span>
                        </a>
                    </li>
                    
                    <!-- Manage Cameras -->
                    <li>
                        <a href="{% url 'camera_config_list' %}" class="sidebar-item flex items-center py-3 px-4 {% if request.resolver_match.url_name == 'camera_config_list' %}active{% endif %}">
                            <i class="fas fa-video text-xl w-8"></i>
                            <span class="text-sm font-medium">Manage Cameras</span>
                        </a>
                    </li>
                </ul>
            </nav>
            
            <!-- Footer de la sidebar -->
            <div class="border-t border-white/10 p-4">
                <div class="sidebar-item flex items-center py-3 px-4 text-white/80 hover:text-white">
                    <i class="fas fa-cog text-xl w-8"></i>
                    <span class="text-sm font-medium">Settings</span>
                </div>
            </div>
        </div>
        
        <!-- Contenu principal avec header -->
        <div class="main-content flex-1 overflow-auto">
            <!-- Header fixe -->
            <header class="header sticky top-0 z-10 bg-white px-8 flex items-center justify-between">
                <!-- Titre de la page -->
                <h2 class="text-xl font-semibold text-gray-800">
                    {% block page_title %}{% endblock %}
                </h2>
                
                <!-- Profil utilisateur -->
                <div class="flex items-center space-x-4">
                    <!-- Notifications -->
                    <button class="relative p-2 text-gray-500 hover:text-[#233853] transition-colors">
                        <i class="fas fa-bell text-xl"></i>
                        <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                    </button>
                    
                    <!-- Profil -->
                    <div class="flex items-center space-x-3">
                        <div class="text-right">
                            <p class="text-sm font-medium text-gray-700">Admin</p>
                            <p class="text-xs text-gray-500">admin@example.com</p>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-[#233853]/10 flex items-center justify-center">
                            <i class="fas fa-user text-[#233853]"></i>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Contenu dynamique -->
            <main class="p-8">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
